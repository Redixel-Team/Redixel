[workspace]
members = ["crates/*", "examples/unites_war", "tools/builder", "tools/fps-bench"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Redixel Core Team"]
repository = "https://github.com/Redixel-Team"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
# Internal crates
redixel = { path = "crates/redixel" }
redixel-math = { path = "crates/redixel-math" }
redixel-core = { path = "crates/redixel-core" }
redixel-platform = { path = "crates/redixel-platform" }
redixel-renderer = { path = "crates/redixel-renderer" }
redixel-runtime = { path = "crates/redixel-runtime" }
redixel-net = { path = "crates/redixel-net" }

# External crates
android_logger = "0.15.1"
console_error_panic_hook = "0.1"
env_logger = "0.11"
log = "0.4"
pollster = "1.0.1"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
winit = "0.31.0-beta.2"
wgpu = "30.0.0"
bytemuck = "1.25.0"
bytes = "1.12.0"
image = { version = "0.25.10", default-features = false }
wtransport = "0.7.1"
tokio = "1.52.3"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3.103"
web-time = "1.1"
