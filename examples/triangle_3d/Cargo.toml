[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "triangle_3d"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.game]
title = "Triangle 3D"
description = "A rotating 3D tetrahedron demonstrating perspective projection, depth-buffered occlusion, and 3D transformations."
tags = ["3D", "Math", "Projection"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel" }

# External crates
log = "0.4"
