name: Build & Test

on:
  pull_request:
    branches: ['main', 'develop', 'dev-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  format:
    name: Check Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup show

      - name: Verify Formatting (rustfmt)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: fmt
          args: '-- --check'
          root-flag: ''

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Graphics & Audio Deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 xvfb mesa-vulkan-drivers libasound2-dev

      - name: Setup Rust
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (Clippy)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          args: '-- -D warnings'

      - name: Lint Networking Crates (net feature)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          root-flag: '-p redixel-core -p redixel-net -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/net,redixel/net --all-targets -- -D warnings'
          skip-examples: 'true'

      - name: Lint Audio Crates (audio feature)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          root-flag: '-p redixel-core -p redixel-audio -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/audio,redixel/audio --all-targets -- -D warnings'
          skip-examples: 'true'

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          args: '--verbose'
          xvfb: 'true'
        env:
          WGPU_BACKEND: vulkan

      - name: Test Networking Crates (net feature, Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-net -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/net,redixel/net --verbose'
          skip-examples: 'true'
          xvfb: 'true'
        env:
          WGPU_BACKEND: vulkan

      - name: Test Audio Crates (audio feature, Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-audio -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/audio,redixel/audio --verbose'
          skip-examples: 'true'
          xvfb: 'true'
        env:
          WGPU_BACKEND: vulkan

      - name: Build Executables (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: build
          args: '--verbose'

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          args: '--verbose'

      - name: Test Networking Crates (net feature, Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-net -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/net,redixel/net --verbose'
          skip-examples: 'true'

      - name: Test Audio Crates (audio feature, Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-audio -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/audio,redixel/audio --verbose'
          skip-examples: 'true'

      - name: Build Executables (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: build
          args: '--verbose'

      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          args: '--verbose'

      - name: Test Networking Crates (net feature, macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-net -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/net,redixel/net --verbose'
          skip-examples: 'true'

      - name: Test Audio Crates (audio feature, macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: test
          root-flag: '-p redixel-core -p redixel-audio -p redixel-runtime -p redixel'
          args: '--features redixel-runtime/audio,redixel/audio --verbose'
          skip-examples: 'true'

      - name: Build Executables (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/cargo-each
        with:
          subcommand: build
          args: '--verbose'

  wasm:
    name: WebAssembly (WASM)
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (Clippy)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          target: wasm32-unknown-unknown
          args: '-- -D warnings'

      - name: Build Executables (WASM)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: build
          target: wasm32-unknown-unknown
          args: '--verbose'

  android:
    name: Android (APK)
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup target add aarch64-linux-android
          rustup show

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Install Android Platform 30
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30"

      - name: Configure NDK C Toolchain
        run: |
          NDK_BIN="$(find "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt" -maxdepth 1 -type d -name '*-x86_64')/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (Clippy)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          target: aarch64-linux-android
          args: '--lib -- -D warnings'

      - name: Build Executables (Android)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: 'apk build'
          args: '--lib'
          skip-root: 'true'

  ios:
    name: iOS (Static Lib)
    needs: format
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup target add aarch64-apple-ios
          rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (Clippy)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: clippy
          target: aarch64-apple-ios
          args: '--lib -- -D warnings'

      - name: Build Examples (iOS)
        uses: ./.github/actions/cargo-each
        with:
          subcommand: build
          target: aarch64-apple-ios
          args: '--lib'
          skip-root: 'true'

  benchmark:
    name: FPS Benchmark
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Graphics Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 xvfb mesa-vulkan-drivers

      - name: Setup Rust
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Benchmark Tool
        run: cargo build --release -p fps-bench

      - name: Run Benchmark
        run: xvfb-run --auto-servernum ./target/release/fps-bench benchmark_result.json
        env:
          WGPU_BACKEND: vulkan

      - name: Format Results
        run: |
          {
            echo "<h3 align=\"center\">FPS Benchmark</h3>"
            echo "<p align=\"center\"><sub>Measures CPU-side engine cost (batching, frame loop) under a software-rendered GPU — not representative of real hardware FPS. See the job log for the adapter actually used.</sub></p>"
            echo
            echo "<table align=\"center\">"
            echo "<thead><tr><th align=\"center\">Scene</th><th align=\"center\">Median FPS</th><th align=\"center\">Spread</th><th align=\"center\">Frame Time (ms)</th><th align=\"center\">P95 Frame Time (ms)</th><th align=\"center\">Allocations</th></tr></thead>"
            echo "<tbody>"
            jq -r '.tiers[] | "<tr><td align=\"center\">\(.scene)</td><td align=\"center\"><strong>\(.median_fps)</strong></td><td align=\"center\">\(.spread_pct)% (\(.fps_min)–\(.fps_max))</td><td align=\"center\">\(.median_frame_ms)</td><td align=\"center\">\(.median_p95_frame_ms)</td><td align=\"center\">\(.allocations) (\(.allocated_bytes) B)</td></tr>"' benchmark_result.json
            echo "</tbody>"
            echo "</table>"
            echo
            echo "<p align=\"center\"><sub>Median of $(jq -r '.rounds' benchmark_result.json) rounds per tier, $(jq -r '.measure_frames' benchmark_result.json) frames each after a warmup of at least $(jq -r '.warmup_ms' benchmark_result.json) ms and $(jq -r '.warmup_frames' benchmark_result.json) frames, tiers interleaved · Marginal cost: <strong>$(jq -r '.marginal_ms_per_1000_quads' benchmark_result.json) ms</strong> per 1000 additional quads · <strong>Spread is how far apart identical runs landed — treat any FPS delta below it as noise</strong> · allocations are deterministic and the most reliable column here.</sub></p>"
          } > benchmark_summary.md

      - name: Show Results in Job Summary
        run: cat benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Results on PR
        continue-on-error: true
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file benchmark_summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
