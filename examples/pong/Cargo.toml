[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "pong"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.game]
title = "Pong"
description = "The classic reimagined. Showcasing paddle physics, an AI opponent and low-latency keyboard and mouse-wheel input."
tags = ["Input", "2D_Collision"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel" }

# External crates
log = "0.4"
