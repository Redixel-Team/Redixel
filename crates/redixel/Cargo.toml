[package]
name = "redixel"
description = "Public façade and entry point for the Redixel engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
net = ["dep:redixel-net", "redixel-runtime/net"]
audio = ["redixel-runtime/audio"]

[dependencies]
# Internal crates
redixel-core = { workspace = true, features = ["wgpu"] }
redixel-math = { workspace = true, features = ["wgpu"] }
redixel-platform = { workspace = true }
redixel-renderer = { workspace = true }
redixel-runtime = { workspace = true }
redixel-net = { workspace = true, optional = true }

# External crates
log = { workspace = true }
winit = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
env_logger = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
wasm-bindgen = { workspace = true }