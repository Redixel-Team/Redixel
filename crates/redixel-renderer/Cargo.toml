[package]
name = "redixel-renderer"
description = "WGPU-backed renderer for the Redixel engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The native renderer built directly on `wgpu-hal` (Vulkan). Temporary: once
# every native backend is ported it becomes the only native renderer.
hal = ["dep:wgpu-hal", "dep:naga", "dep:ash", "dep:raw-window-handle"]

[dependencies]
# Internal crates
redixel-core = { workspace = true, features = ["wgpu"] }
redixel-math = { workspace = true, features = ["wgpu"] }
redixel-profile = { workspace = true }

# External crates
log = { workspace = true }
wgpu = { workspace = true }
wgpu-types = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
image = { workspace = true, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu-hal = { workspace = true, features = ["vulkan"], optional = true }
naga = { workspace = true, features = ["wgsl-in"], optional = true }
ash = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
