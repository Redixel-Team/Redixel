[package]
name = "redixel-runtime"
description = "Engine runtime: application loop, settings, and time management."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
net = ["dep:redixel-net"]
audio = ["dep:redixel-audio"]

[dependencies]
# Internal crates
redixel-core = { workspace = true }
redixel-platform = { workspace = true }
redixel-renderer = { workspace = true }
redixel-math = { workspace = true }
redixel-net = { workspace = true, optional = true }
redixel-audio = { workspace = true, optional = true }

# External crates
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }